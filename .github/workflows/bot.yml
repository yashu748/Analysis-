name: pattern-bot
on:
  schedule:
    - cron: "0 */6 * * *"      # har 6 ghante naya run
  workflow_dispatch:            # haath se start karne ke liye
concurrency:
  group: pattern-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy matplotlib
      - run: python pattern_bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_MINUTES: "350"
