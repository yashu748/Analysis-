name: Chart Loop Workflow
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: chart-loop
  cancel-in-progress: false

jobs:
  build:  # <--- Yahan ek job ID add karni padegi
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas matplotlib
      - name: Keep schedule alive
        run: gh workflow enable chart-loop.yml || true
        env:
          PYTHONUNBUFFERED: "1"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TF: "1h"
          GH_TOKEN: ${{ github.token }}
      - run: python chart_loop.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TF: "1h"
          INTERVAL: "180"
          RUN_MINUTES: "340"
          MIN_QUOTE_VOL: "1000000"
          MAX_COINS: "150"
          MIN_SCORE: "6"
          MIN_BUY_RATIO: "0.60"
          COOLDOWN_H: "6"
          MAX_PAT_ALERTS: "5"
          PAT_BREAKOUT_ONLY: "1"
          MIN_CONFIRM_PAT: "3"
          LEVERAGE: "10"
          MIN_RISK_PCT: "0.6"
