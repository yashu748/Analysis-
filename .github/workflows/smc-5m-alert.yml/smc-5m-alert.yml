name: smc-15m-alert
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Telegram test message bhejna hai? (yes/no)"
        default: "no"
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: Run SMC scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INTERVAL: "15m"
          PAIRS: "BTC_USDT,ETH_USDT,SOL_USDT"
        run: |
          if [ "${{ github.event.inputs.test }}" = "yes" ]; then python smc_alert.py test; else python smc_alert.py; fi
