name: crypto-15m-alert-bot

on:
  workflow_dispatch:          # manual start (Actions tab > Run workflow)
  schedule:
    - cron: "5 * * * *"       # har ghante check: agar bot band hai to restart

# Ek time par sirf ek bot chale (duplicate alert na aaye)
concurrency:
  group: crypto-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy matplotlib
      - name: Run bot (loop ~5h50m, phir next run uthata hai)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_MINUTES: "350"
        run: python chart_bot.py
